space        cycle pause; script-binding uosc/flash-pause-indicator
RIGHT        seek 5; script-binding uosc/flash-timeline; show-text "${time-pos} / ${duration}"
LEFT         seek -5; script-binding uosc/flash-timeline; show-text "${time-pos} / ${duration}"
shift+right  seek  30; script-binding uosc/flash-timeline; show-text "${time-pos} / ${duration}"
shift+left   seek -30; script-binding uosc/flash-timeline; show-text "${time-pos} / ${duration}"
m            no-osd cycle mute; script-binding uosc/flash-volume
up           no-osd add volume  10; script-binding uosc/flash-volume
down         no-osd add volume -10; script-binding uosc/flash-volume
[            no-osd add speed -0.25; script-binding uosc/flash-speed
]            no-osd add speed  0.25; script-binding uosc/flash-speed
\            no-osd set speed 1; script-binding uosc/flash-speed
>            script-binding uosc/next; script-message-to uosc flash-elements top_bar,timeline
<            script-binding uosc/prev; script-message-to uosc flash-elements top_bar,timeline
tab          script-binding uosc/toggle-ui
c            script-binding videoclip-menu-open
t            script-message-to theme_switcher open-menu
l            script-message-to layout_picker open-menu
ctrl+h       script-message-to uosc toggle-elements controls,timeline,top_bar,volume