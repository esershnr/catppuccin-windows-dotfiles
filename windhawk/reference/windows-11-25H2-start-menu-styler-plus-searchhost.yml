themeResourceVariables:
  - ''
webContentStyles:
  # --- genel zemin ---
  # html/body seffaf birakiliyor ki arka plan viewport canvas'ina yayilmasin;
  # boylece #rootContainer'in alt kose yariclapi gercekten kirpabiliyor
  - target: 'html, body'
    styles:
      - 'background: transparent !important'
      - 'color: #cdd6f4 !important'
  - target: '#rootContainer'
    styles:
      - 'background: #11111b !important'
      - 'border-bottom-left-radius: 25px !important'
      - 'border-bottom-right-radius: 25px !important'
      - 'overflow: hidden !important'
  - target: '#root, .scr, .resultsContainer'
    styles:
      - 'background: transparent !important'
      - 'color: #cdd6f4 !important'

  # --- ust filtre cubugu: Tumu / Uygulamalar / Belgeler ... ---
  - target: '#scopesHeader'
    styles:
      - 'background: #11111b !important'
      - 'border-bottom: 1px solid #313244 !important'
  - target: '.scope-tile, .scope-tile--selected'
    styles:
      - 'background: transparent !important'
      - 'box-shadow: none !important'
  # pill'in gorunen kutusu .scope-tile degil, .scope-tile__title
  - target: '.scope-tile__title'
    styles:
      - 'background: transparent !important'
      - 'color: #cdd6f4 !important'
      - 'border: 1px solid #313244 !important'
      - 'border-radius: 12px !important'
      - 'font-family: JetBrainsMono NF, Segoe UI, sans-serif !important'
  - target: '.scope-tile:hover .scope-tile__title'
    styles:
      - 'background: #181825 !important'
      - 'border-color: #cba6f7 !important'
      - 'color: #cdd6f4 !important'
  - target: '.scope-tile--selected .scope-tile__title'
    styles:
      - 'background: #cba6f7 !important'
      - 'border-color: #cba6f7 !important'
      - 'color: #11111b !important'
  # sol/sag ok ve tum font ikonlari
  - target: '.iconContent.cortanaFontIcon'
    styles:
      - 'color: #cba6f7 !important'

  # --- sonuc listesi ---
  - target: '#topHitHeader .groupHeader, .groupTitle, .groupTitleText, h4.groupTitle'
    styles:
      - 'color: #cba6f7 !important'
      - 'background: transparent !important'
  - target: '.suggestion, .suggContainer, .suggDetailsContainer'
    styles:
      - 'background: transparent !important'
      - 'border: 0 !important'
  # li.suggestion overflow:hidden + radius:4px, cocugun 1px saga kaymis
  # cercevesini kirpiyordu -> kirpmayi kaldir, kaymayi sifirla
  - target: '.suggestion'
    styles:
      - 'overflow: visible !important'
      - 'border-radius: 12px !important'
  - target: '.suggContainer'
    styles:
      - 'border-radius: 12px !important'
      - 'margin-left: 0 !important'
  - target: '.suggestion:hover .suggContainer'
    styles:
      - 'background: #181825 !important'
  # .leftPill sayfanin kendi 'sagi acik yarim pill' cizimi -> notrlestir
  - target: '.suggDetailsContainer, .leftPill, .openPreviewPaneBtn'
    styles:
      - 'border-radius: 12px !important'
      - 'box-shadow: none !important'
      - 'background: transparent !important'
  - target: '.suggestion.selected .suggContainer'
    styles:
      - 'background: #181825 !important'
      - 'border: 1px solid #cba6f7 !important'
      - 'border-radius: 12px !important'
      - 'box-shadow: none !important'
  # secili satirin cercevesi sag taraftaki scrollbar'a degmesin
  - target: '#qfContainerScroll, #suggestionsList'
    styles:
      - 'padding-right: 10px !important'
      - 'box-sizing: border-box !important'
  - target: '.primaryText, .primaryTextContent, .title'
    styles:
      - 'color: #cdd6f4 !important'
  - target: '.secondaryText, .annotation, .additionalInfoText'
    styles:
      - 'color: #6c7086 !important'

  # --- sag onizleme paneli ---
  - target: '#qfPreviewPane, #localScrollArea'
    styles:
      - 'background: transparent !important'
  # panelin ust/alt/sag boslugunu ebeveyn padding'i ile ver
  - target: '#qfPreviewScrollArea'
    styles:
      - 'background: transparent !important'
      - 'padding: 10px 16px 16px 0 !important'
      - 'box-sizing: border-box !important'
  - target: '#localPane.previewContainer'
    styles:
      - 'background: #181825 !important'
      - 'border: 1px solid #cba6f7 !important'
      - 'border-radius: 16px !important'
      - 'margin: 0 !important'
      - 'height: 100% !important'
      - 'max-height: 100% !important'
      - 'width: 100% !important'
      - 'box-sizing: border-box !important'
  - target: '.divider'
    styles:
      - 'background: #313244 !important'
      - 'border-color: #313244 !important'
  - target: '.sectionItem'
    styles:
      - 'border-radius: 8px !important'
  - target: '.sectionItem:hover'
    styles:
      - 'background: #313244 !important'

  # --- kaydirma cubugu ---
  - target: '::-webkit-scrollbar'
    styles:
      - 'width: 10px !important'
  - target: '::-webkit-scrollbar-track'
    styles:
      - 'background: transparent !important'
  - target: '::-webkit-scrollbar-thumb'
    styles:
      - 'background: #45475a !important'
      - 'border-radius: 10px !important'
      - 'border: 3px solid transparent !important'
      - 'background-clip: padding-box !important'
webContentCustomJs: ''
